<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asian Secret Hero Animation Prototype</title>
  <style>
    :root {
      --ivory: #f8f2ed;
      --cream: #efe3d7;
      --pink: #f3a9ad;
      --rose: #b85d68;
      --gold: #c89235;
      --ink: #0a0908;
      --muted: #746966;
      --mx: 0;
      --my: 0;
      color: var(--ink);
      font-family: "Manrope", "Inter", "Segoe UI", sans-serif;
      background: var(--ivory);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 73% 12%, rgba(243, 169, 173, 0.26), transparent 34%),
        linear-gradient(120deg, #fffaf7 0%, var(--ivory) 48%, #f6e7e3 100%);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 0.86fr) minmax(520px, 1.35fr);
      align-items: center;
      gap: clamp(24px, 4vw, 72px);
      padding: clamp(24px, 4.2vw, 72px);
      isolation: isolate;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(200, 146, 53, 0.42);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      animation: ring-drift 16s ease-in-out infinite alternate;
    }

    .hero::before {
      width: min(48vw, 760px);
      aspect-ratio: 1;
      right: 11vw;
      top: 7vh;
    }

    .hero::after {
      width: min(28vw, 430px);
      aspect-ratio: 1;
      right: -6vw;
      top: -7vh;
      animation-delay: -7s;
    }

    .copy {
      position: relative;
      z-index: 4;
      max-width: 680px;
      padding-top: 34px;
      transform: translate3d(calc(var(--mx) * -7px), calc(var(--my) * -5px), 0);
      transition: transform 240ms ease-out;
    }

    .eyebrow {
      margin: 0 0 30px;
      color: var(--rose);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(60px, 8vw, 142px);
      line-height: 0.9;
      font-weight: 500;
      letter-spacing: 0;
    }

    h1 span {
      display: block;
      color: #c97882;
      font-style: italic;
    }

    .copy p {
      max-width: 610px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.4vw, 22px);
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 30px;
      border-radius: 999px;
      border: 1px solid rgba(184, 93, 104, 0.42);
      color: var(--rose);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(12px);
    }

    .button.primary {
      border-color: var(--ink);
      color: #fff;
      background: var(--ink);
      box-shadow: 0 22px 48px rgba(10, 9, 8, 0.18);
    }

    .stage-wrap {
      position: relative;
      z-index: 3;
      width: min(100%, 1120px);
      margin-left: auto;
      perspective: 1400px;
      transform: translate3d(calc(var(--mx) * 10px), calc(var(--my) * 7px), 0);
      transition: transform 260ms ease-out;
    }

    .stage {
      position: relative;
      aspect-ratio: 1672 / 941;
      width: 100%;
      min-width: 520px;
      transform-style: preserve-3d;
      transform:
        rotateX(calc(var(--my) * -2.2deg))
        rotateY(calc(var(--mx) * 2.8deg));
      animation: camera-push 10s ease-in-out infinite alternate;
    }

    .hero-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 34px 52px rgba(97, 65, 54, 0.13));
      transform: translateZ(0);
      user-select: none;
      pointer-events: none;
    }

    .focus-product {
      position: absolute;
      z-index: 3;
      width: var(--w);
      left: var(--l);
      top: var(--t);
      filter: drop-shadow(0 30px 34px rgba(90, 25, 70, 0.16));
      transform-origin: 50% 78%;
      user-select: none;
      pointer-events: none;
    }

    .focus-product.resbro {
      --w: 22%;
      --l: 43.3%;
      --t: 14.2%;
      animation: float-resbro 7.5s ease-in-out infinite;
    }

    .focus-product.tuneup {
      --w: 12.6%;
      --l: 64.4%;
      --t: 20.2%;
      filter: drop-shadow(0 24px 28px rgba(48, 85, 122, 0.14));
      animation: float-tuneup 8.6s ease-in-out infinite;
      animation-delay: -1.6s;
    }

    .glow {
      position: absolute;
      width: 42%;
      aspect-ratio: 1.3;
      left: 39%;
      top: 26%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.72), transparent 67%);
      filter: blur(4px);
      transform: translateZ(-120px);
      opacity: 0.8;
      pointer-events: none;
    }

    .petal {
      position: absolute;
      z-index: 5;
      width: clamp(12px, 1.4vw, 22px);
      aspect-ratio: 1.45;
      border-radius: 72% 28% 65% 35%;
      background: radial-gradient(circle at 32% 28%, #fff8f8, #f4b5b7 58%, #d8828d);
      opacity: 0.74;
      transform: rotate(var(--r));
      animation: petal-drift var(--d) linear infinite;
      animation-delay: var(--delay);
      filter: blur(var(--blur));
    }

    .petal:nth-child(1) { --r: 22deg; --d: 16s; --delay: -2s; --blur: 0px; left: 6%; top: -6%; }
    .petal:nth-child(2) { --r: -34deg; --d: 20s; --delay: -9s; --blur: 0.3px; left: 18%; top: -10%; }
    .petal:nth-child(3) { --r: 56deg; --d: 18s; --delay: -5s; --blur: 0px; left: 47%; top: -8%; }
    .petal:nth-child(4) { --r: -15deg; --d: 23s; --delay: -14s; --blur: 0.6px; left: 71%; top: -9%; }
    .petal:nth-child(5) { --r: 11deg; --d: 19s; --delay: -11s; --blur: 0.2px; left: 91%; top: -7%; }
    .petal:nth-child(6) { --r: 42deg; --d: 24s; --delay: -17s; --blur: 0.7px; left: 36%; top: -5%; }

    .motion-strip {
      position: absolute;
      left: clamp(24px, 4.2vw, 72px);
      right: clamp(24px, 4.2vw, 72px);
      bottom: 24px;
      z-index: 6;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200, 146, 53, 0.75), transparent);
      transform-origin: left center;
      animation: gold-sweep 5s ease-in-out infinite;
      opacity: 0.55;
    }

    @keyframes camera-push {
      from {
        transform:
          rotateX(calc(var(--my) * -2.2deg))
          rotateY(calc(var(--mx) * 2.8deg))
          translate3d(0, 0, 0)
          scale(1);
      }
      to {
        transform:
          rotateX(calc(var(--my) * -2.2deg))
          rotateY(calc(var(--mx) * 2.8deg))
          translate3d(0, -8px, 34px)
          scale(1.018);
      }
    }

    @keyframes float-resbro {
      0%, 100% {
        transform: translate3d(calc(var(--mx) * 13px), calc(var(--my) * 8px), 80px) rotate(-0.8deg);
      }
      50% {
        transform: translate3d(calc(var(--mx) * 13px), calc(var(--my) * 8px - 13px), 116px) rotate(0.9deg);
      }
    }

    @keyframes float-tuneup {
      0%, 100% {
        transform: translate3d(calc(var(--mx) * -9px), calc(var(--my) * 8px), 58px) rotate(2deg);
      }
      50% {
        transform: translate3d(calc(var(--mx) * -9px), calc(var(--my) * 8px - 9px), 92px) rotate(0deg);
      }
    }

    @keyframes petal-drift {
      0% {
        translate: 0 -10vh;
        rotate: 0deg;
      }
      100% {
        translate: clamp(-90px, -5vw, -30px) 112vh;
        rotate: 460deg;
      }
    }

    @keyframes ring-drift {
      from {
        transform: translate3d(calc(var(--mx) * -16px), calc(var(--my) * -10px), 0) scale(1);
      }
      to {
        transform: translate3d(calc(var(--mx) * -16px + 14px), calc(var(--my) * -10px - 10px), 0) scale(1.035);
      }
    }

    @keyframes gold-sweep {
      0%, 100% {
        transform: scaleX(0.72);
        opacity: 0.22;
      }
      50% {
        transform: scaleX(1);
        opacity: 0.62;
      }
    }

    @media (max-width: 1060px) {
      .hero {
        min-height: auto;
        grid-template-columns: 1fr;
        padding-bottom: 58px;
      }

      .copy {
        max-width: 760px;
        padding-top: 12px;
      }

      h1 {
        max-width: 10ch;
      }

      .stage-wrap {
        width: 100%;
        margin: -12px auto 0;
      }

      .stage {
        min-width: 0;
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding: 22px 18px 46px;
        gap: 18px;
      }

      .eyebrow {
        margin-bottom: 18px;
        font-size: 11px;
      }

      h1 {
        font-size: clamp(48px, 16vw, 74px);
      }

      .copy p {
        margin-top: 20px;
        font-size: 15px;
        line-height: 1.55;
      }

      .actions {
        gap: 10px;
        margin-top: 24px;
      }

      .button {
        min-height: 50px;
        padding: 0 18px;
        font-size: 11px;
        letter-spacing: 0.11em;
      }

      .stage-wrap {
        width: 148%;
        margin-left: -34%;
      }

      .motion-strip {
        bottom: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero" id="hero">
    <div class="petal-field" aria-hidden="true">
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
    </div>

    <section class="copy" aria-label="Asian Secret hero copy">
      <p class="eyebrow">Японска и азиатска козметика</p>
      <h1>Ритуалът на <span>сияйната</span> кожа</h1>
      <p>Подбрани тъкани маски, пачове за очи и грижа от Япония, Корея и Тайланд. Нежна ежедневна сцена с движение, готова за развитие в 3D видео.</p>
      <div class="actions">
        <a class="button primary" href="#">Разгледай продуктите</a>
        <a class="button" href="#">За бранда</a>
      </div>
    </section>

    <section class="stage-wrap" aria-label="Animated product display">
      <div class="stage">
        <div class="glow" aria-hidden="true"></div>
        <img class="hero-art" src="assets/hero-products-display.png" alt="Asian Secret skincare product display">
        <img class="focus-product resbro" src="assets/resbro-ex-40-sheets.png" alt="">
        <img class="focus-product tuneup" src="assets/tuneup-niacinamide-7-sheets.png" alt="">
      </div>
    </section>

    <div class="motion-strip" aria-hidden="true"></div>
  </main>

  <script>
    const root = document.getElementById("hero");
    const damp = 0.18;
    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;

    function setPointerPosition(clientX, clientY) {
      const rect = root.getBoundingClientRect();
      targetX = ((clientX - rect.left) / rect.width - 0.5) * 2;
      targetY = ((clientY - rect.top) / rect.height - 0.5) * 2;
    }

    root.addEventListener("pointermove", (event) => {
      setPointerPosition(event.clientX, event.clientY);
    });

    root.addEventListener("pointerleave", () => {
      targetX = 0;
      targetY = 0;
    });

    function animate() {
      currentX += (targetX - currentX) * damp;
      currentY += (targetY - currentY) * damp;
      root.style.setProperty("--mx", currentX.toFixed(4));
      root.style.setProperty("--my", currentY.toFixed(4));
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
